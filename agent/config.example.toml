# Налаштування голосової Хомі. Скопіюй у config.toml і зміни під себе.

[user]
name = "Ігор"            # як Хомі до тебе звертається
name_genitive = "Ігоря"  # «особиста помічниця Ігоря»
name_vocative = "Ігорю"   # як Хомі до тебе звертається: «Привіт, Ігорю!» (можна "Ігоре" чи просто "Ігор")

[ollama]
url = "http://localhost:11434"
model = "gemma4:26b"
num_ctx = 32768          # той самий, що в Open WebUI, щоб Ollama не перезавантажувала модель
temperature = 0.4
keep_alive = "24h"       # тримати Gemma у відеокарті; «Пауза» на сфері вивантажує її для ігор
num_thread = 8           # ядра процесора для частини Gemma, що не влізла у відеокарту (8 = лише швидкі P-ядра, мишка не лагає)

[stt]
engine = "parakeet"            # NVIDIA Parakeet v3 на процесорі, ~0.1 с (точніший на твоєму голосі); "canary"; "whisper" — ~3 с
fallback_engine = "canary"     # Parakeet інколи вгадує не ту мову — тоді перепитує Canary з примусовою українською (~0.2 с)
whisper_fallback = false       # ще й Whisper як останній запасний (+1 ГБ пам'яті)
wake_model = "small"           # маленька модель — лише щоб почути «Хомі»
model = "large-v3-turbo"       # точна модель для команд
device = "cpu"                # "cpu": на відеокарті Whisper витісняє Gemma в повільну пам'ять (відповідь 80+ с замість 1 с)
compute_type = "int8"          # для процесора
cpu_threads = 16              # розпізнавання й Gemma не працюють одночасно, тож усі швидкі ядра — розпізнаванню
language = "uk"
beam_size = 1                  # 1 = найшвидше; 5 = трохи точніше, але вдвічі повільніше

[wake]
min_seconds = 0.6        # «Хооміі» має тривати щонайменше стільки (звичайне коротке «Хомі» ~0.4 с)
max_words = 3
follow_up_seconds = 12   # скільки чекати продовження розмови без нового «Хомі»
end_silence_ms = 350      # тиша після «Хооміі», після якої Хомі вирішує (менше = швидше, але може обрізати слово)
sure_score = 0.9          # детектор упевнений настільки — прокидається одразу, без перевірки текстом (вище = обережніше)
command_silence_ms = 700  # скільки тиші після твоєї фрази = «я договорив» (менше = швидше, але може перебити на паузі)
barge_in = true           # можна перебити Хомі: «стоп», «почекай», «Хомі…» або «стоп, а яка погода?»
one_breath = true         # «Хомі, яка завтра погода?» одним подихом — без «Так?»

[audio]
input_device = ""        # порожньо = мікрофон за замовчуванням
output_device = ""       # порожньо = колонки/навушники за замовчуванням
keepalive_db = "off"      # для колонки, що з'їдає перші склади: -70 (ледь чутний шум не дає їй заснути); з навушниками — "off"
keep_output_open = false  # true — звук відкритий завжди (колонка не засинає); false — лише поки Хомі говорить (без шипіння в навушниках)
vad_aggressiveness = 2   # 0..3, більше = суворіше відсікає шум

[tts]
# Голос Хомі — Марічка Штирбулова (локальний StyleTTS2, docker compose у config/tts-uk).
url = "http://localhost:8003/v1/audio/speech"
model = "multi"
voice = "Марічка Штирбулова"
speed = 1.0

[tts.fallback]
# Запасний голос — Поліна (edge-tts), якщо сервер StyleTTS2 не запущений.
url = "http://localhost:5050/v1/audio/speech"
model = "tts-1"
api_key = "homyy"
voice = "uk-UA-PolinaNeural"
speed = 1.2

[search]
url = "http://localhost:8888"

[openwebui]
url = "http://localhost:3000"
api_key = ""             # Налаштування → Обліковий запис → API-ключі. Потрібен для спільної пам'яті

# Програми й сайти, які Хомі може відкривати за назвою (лише з цього списку).
[apps]
steam = "steam://open/main"
youtube = "https://www.youtube.com"
"youtube music" = "https://music.youtube.com"
telegram = "tg://"
"блокнот" = "notepad.exe"
"калькулятор" = "calc.exe"

[ui]
widget = true            # кулька-віджет у кутку екрана
position = "bottom-right"  # або "top-left"
greet = true             # привітатися голосом після запуску

[game]
enabled = true           # ігровий режим: у грі Хомі звільняє відеокарту й процесор
voice_wake = false       # false — у грі взагалі не слухає мікрофон (кличеш Ctrl+Alt+H); true — слухає «Хооміі»
processes = ["cs2.exe"]  # ігри, які завжди вважати грою (навіть у вікні)
ignore = []              # програми на весь екран, які НЕ є грою (браузери й плеєри вже враховано)

[obsidian]
vault = ""               # шлях до сховища Obsidian, наприклад "C:/Users/igork/Documents/Obsidian Vault"

[telegram]
token = ""               # токен від @BotFather
allowed_ids = []         # твій Telegram ID (бот підкаже його, якщо написати йому)

[monobank]
token = ""               # особистий токен з https://api.monobank.ua/ (лише читання)

[gmail]
address = ""             # твоя адреса Gmail
app_password = ""        # пароль застосунку (Google-акаунт → Безпека → Паролі застосунків), НЕ звичайний пароль
